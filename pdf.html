<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 双语阅读器 · 沉浸式翻译</title>
  <link rel="stylesheet" href="src/pdf.css">
  <script type="module" src="src/pdf.js"></script>
</head>
<body data-mode="compare">
  <header class="reader-header">
    <a class="brand" href="pdf.html" aria-label="PDF 双语阅读器首页">译</a>
    <div class="document-info">
      <h1 id="fileName">PDF 双语阅读器</h1>
      <p id="documentDetails">打开一份 PDF，开启专注的双语阅读</p>
    </div>
    <button id="openFile" class="quiet header-file" type="button">打开文件</button>
    <button id="openSettings" class="config-button" type="button" title="在扩展设置中更改引擎与目标语言">
      <span id="engineName">读取设置中</span><span class="config-arrow" aria-hidden="true">→</span><span id="targetLanguage">简体中文</span><span class="settings-icon" aria-hidden="true">⚙</span>
    </button>
    <button id="translateButton" class="primary" type="button" data-state="idle" disabled>翻译当前页</button>
  </header>

  <nav class="reader-toolbar" aria-label="PDF 阅读工具">
    <button id="outlineToggle" class="tool-button" type="button" aria-expanded="true" aria-controls="outlinePanel"><span aria-hidden="true">☰</span> 目录</button>
    <div class="mode-switch" role="group" aria-label="阅读模式">
      <button id="modeCompare" type="button" aria-pressed="true">双语对照</button>
      <button id="modeReading" type="button" aria-pressed="false">双语阅读</button>
      <button id="modeOriginal" type="button" aria-pressed="false">仅原文</button>
    </div>
    <div class="page-controls">
      <button id="previousPage" class="icon-button" type="button" aria-label="上一页" disabled>‹</button>
      <label for="pageNumber" class="sr-only">当前页码</label>
      <input id="pageNumber" type="number" min="1" value="1" inputmode="numeric" disabled>
      <span class="page-count">/ <span id="pageTotal">0</span></span>
      <button id="nextPage" class="icon-button" type="button" aria-label="下一页" disabled>›</button>
    </div>
    <div class="view-controls">
      <label for="zoomSelect" class="sr-only">原稿缩放</label>
      <select id="zoomSelect" aria-label="原稿缩放">
        <option value="fit">适合宽度</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option>
      </select>
      <label class="sync-label"><input id="syncScroll" type="checkbox" checked>同步滚动</label>
    </div>
  </nav>

  <div class="status-bar">
    <p id="status" role="status" aria-live="polite" data-kind="info">仅在点击“翻译当前页”后，才会发送当前页文字。</p>
    <button id="retryButton" type="button" class="text-button" hidden>重试未完成段落</button>
  </div>

  <main id="emptyState" class="empty-state">
    <div class="empty-document" aria-hidden="true"><span>PDF</span><span class="empty-line"></span><span class="empty-line short"></span><span class="empty-pair">A <span>译</span></span></div>
    <p class="eyebrow">让阅读跨越语言</p>
    <h2>原文与理解，放在同一页</h2>
    <p class="empty-description">选择本地 PDF，或打开在线文档。<br>保留原稿，逐页翻译，随时切换双语阅读。</p>
    <button id="chooseFile" class="primary choose-file" type="button">选择 PDF 文件</button>
    <span class="or-divider">或使用文档链接</span>
    <form id="urlForm" class="url-form">
      <label for="urlInput" class="sr-only">在线 PDF 地址</label>
      <input id="urlInput" type="url" placeholder="粘贴 HTTP / HTTPS PDF 地址" autocomplete="off" spellcheck="false" required>
      <button type="submit" class="secondary">打开</button>
    </form>
    <p class="empty-note">文件与译文仅保留在当前标签页；扫描件暂不支持文字识别。</p>
  </main>

  <div id="readerWorkspace" class="reader-workspace" hidden>
    <aside id="outlinePanel" class="outline-panel" aria-label="文档目录">
      <div class="outline-heading"><h2>目录</h2><span>CONTENTS</span></div>
      <nav id="outlineList" aria-label="章节"><p class="outline-empty">正在读取目录…</p></nav>
    </aside>
    <div class="pages-layout" id="pagesLayout">
      <section id="originalPane" class="document-pane" aria-labelledby="originalTitle">
        <div class="pane-heading"><h2 id="originalTitle">原稿</h2><span id="originalPageLabel">PDF 原始页面</span></div>
        <div id="originalScroll" class="pane-scroll">
          <div id="canvasWrapper" class="canvas-wrapper"><canvas id="pdfCanvas" aria-label="PDF 原稿" role="img"></canvas></div>
        </div>
      </section>
      <section id="translatedPane" class="document-pane" aria-labelledby="translationTitle">
        <div class="pane-heading"><h2 id="translationTitle">译文 · 简体中文</h2><span id="translationLayoutLabel">段落重排</span></div>
        <div id="translationScroll" class="pane-scroll">
          <div class="translation-page">
            <p id="translationNotice" class="translation-notice">译文按段落重排；图示与代码保留原文。</p>
            <div id="translationContent"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
  <dialog id="passwordDialog" aria-labelledby="passwordTitle">
    <form id="passwordForm">
      <h2 id="passwordTitle">这份 PDF 需要密码</h2>
      <p id="passwordHint">输入文档密码以继续阅读。密码仅用于本地打开文件。</p>
      <label for="passwordInput">文档密码</label>
      <input id="passwordInput" type="password" autocomplete="off" required>
      <div class="dialog-actions"><button id="passwordCancel" type="button" class="secondary">取消</button><button type="submit" class="primary">打开文档</button></div>
    </form>
  </dialog>
</body>
</html>
